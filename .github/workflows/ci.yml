name: CI source normalization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy

      - name: Resolve dependencies and apply canonical formatting
        run: |
          cargo +1.90.0 generate-lockfile
          cargo +1.90.0 fmt --all

      - name: Verify canonically formatted tree
        run: |
          cargo +1.90.0 check --all-targets --all-features --locked
          cargo +1.90.0 clippy --all-targets --all-features --locked -- -D warnings
          cargo +1.90.0 test --all-targets --all-features --locked
          docker build --tag flags-2-env-api-server:ci .

      - name: Commit verified formatter-only tree
        run: |
          git add Cargo.toml src
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply canonical Rust formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
