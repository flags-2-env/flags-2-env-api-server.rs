    [package]
    name = "flags-2-env-api-server"
    version = "0.1.0"
    edition = "2021"
    license = "MIT"
    description = "JSON API server for flags-2-env"
    repository = "https://github.com/flags-2-env/flags-2-env-api-server.rs"

    [features]
    default = ["tcp-transport", "nats-transport"]
    tcp-transport = []
    nats-transport = []

    [dependencies]
    serde = { version = "1", features = ["derive"] }
    serde_json = "1"
    thiserror = "2"

[lints.rust]
unsafe_code = "forbid"


