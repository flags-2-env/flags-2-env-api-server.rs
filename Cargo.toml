[package]
name = "flags-2-env-api-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JSON API server for flags-2-env"
repository = "https://github.com/flags-2-env/flags-2-env-api-server.rs"

[features]
default = ["tcp-transport", "nats-transport"]
tcp-transport = []
nats-transport = []

[dependencies]
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "6f73bf1ae97f38f05e2e87e4eb3e0e18e0142529", features = ["axum"] }
axum = "0.8.4"
flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "d7bad9ea7dfc657653368237e08903514cdca1ec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
