[package]
name = "flags-2-env-api-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JSON API server for flags-2-env"
repository = "https://github.com/flags-2-env/flags-2-env-api-server.rs"

[features]
default = ["tcp-transport", "nats-transport"]
tcp-transport = []
nats-transport = []

[dependencies]
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware", rev = "6f73bf1ae97f38f05e2e87e4eb3e0e18e0142529", features = ["axum"] }
ores-transport = { git = "https://github.com/ORESoftware/ores-transport.git", rev = "c544e1a11a212dc43a5c1f87ea70a95939e80e2e" }
flags-2-env-lib-core = { git = "https://github.com/flags-2-env/flags-2-env-lib-core.git", rev = "4ec2ce8db44eb630f3d617aecdcf7b9922a64a94", features = ["read-write"] }
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
axum = "0.8.4"
flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "a67c7f106fe0c109750644e4951b8c4b4c92cf53" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.45.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
oresoftware-next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a", version = "0.1.0" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
